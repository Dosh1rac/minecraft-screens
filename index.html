<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Screenshot & Video</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            overflow-x: hidden;
        }

        h1 { padding: 40px 20px 10px 20px; margin: 0; font-size: 2.5rem; }

        .section-title {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #10b981;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            margin: 20px 0;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .download-btn:hover { background: #059669; transform: translateY(-3px); }

        /* Список участников */
        .players-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .player-tag {
            background: #1e293b;
            padding: 6px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.9rem;
            color: #38bdf8;
            cursor: default;
            transition: 0.2s;
        }
        .player-tag:hover { border-color: #38bdf8; }

        /* Галерея */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px 40px 60px 40px;
        }

        .media-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #334155;
            background: #1e293b;
            display: block;
        }

        .media-item:hover { transform: scale(1.03); border-color: #38bdf8; }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Иконка Play для видео в галерее */
        .play-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            opacity: 0.9;
        }

        /* Окно просмотра (Viewer) */
        #viewer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        #viewer.show { opacity: 1; pointer-events: auto; }

        #viewerContent {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        #viewerContent img, #viewerContent video, #viewerContent iframe {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        #description { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 15px; font-weight: 500; }

        .nav-buttons { display: flex; gap: 15px; margin-bottom: 15px; }

        .btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: #475569; }
        #likeBtn { background: #ef4444; display: flex; align-items: center; gap: 8px; }
        #likeBtn:hover { background: #dc2626; }

    </style>
</head>
<body>

    <header style="padding: 40px 20px 10px 20px;">
        <h1>📸 Скрины с сервака</h1>
        <a href="sborka.zip" download class="download-btn">
            📥 Скачать сборку (.zip)
        </a>
    </header>

    <div class="section-title">Наши игроки</div>
    <div class="players-section">
        <div class="player-tag">Dosh1rac</div>
        <div class="player-tag">Meizil</div>
        <div class="player-tag">hirrrrrrrrrrrrrr</div>
        <div class="player-tag">_LumiNebula_</div>
        <div class="player-tag">_Nidalap_</div>
        <div class="player-tag">Vivaotslova</div>
    </div>

    <div class="section-title">Галерея контента</div>
    <div class="gallery" id="mainGallery">

        <div class="media-item" data-youtube="ORHIEH0q6ZA" data-desc="Наш трейлер на YouTube">
            <img src="https://img.youtube.com/vi/ORHIEH0q6ZA/maxresdefault.jpg" alt="YouTube Preview">
            <div class="play-icon">▶️</div>
        </div>

        <div class="media-item" data-video="video.mp4" data-desc="Какое-то крутое видео с сервера">
            <img src="preview.jpg" alt="Local Video Preview">
            <div class="play-icon">▶️</div>
        </div>

        <img src="2026-01-24_16.13.01.png" class="media-item" data-desc="Закат красивый">
        <img src="2026-01-16_16.01.02.png" class="media-item" data-desc="Нууу...">
        <img src="3.png" class="media-item" data-desc="Красиво просто">
        <img src="4.png" class="media-item" data-desc="Ракушка красивая">
        <img src="5.png" class="media-item" data-desc="Кораблик">
        <img src="6.png" class="media-item" data-desc="На ишаках гуляем">
        <img src="7.png" class="media-item" data-desc="Житель на доме стоит">
        <img src="8.png" class="media-item" data-desc="Амбарчик">
        <img src="9.png" class="media-item" data-desc="Соседи">
        <img src="10.png" class="media-item" data-desc="Повесился🤣">
        <img src="11.png" class="media-item" data-desc="Торчун">
        <img src="12.png" class="media-item" data-desc="Барыга">
        <img src="13.png" class="media-item" data-desc="Голый лешка нюхает что то">
        <img src="14.png" class="media-item" data-desc="Наутилусы">
        <img src="15.png" class="media-item" data-desc="Кошмарные ступеньки вместо горы">
        <img src="16.png" class="media-item" data-desc="Лешка и Сашка гуляют по своей плантиции">
        <img src="17.png" class="media-item" data-desc="Самая плохая гора в мире💩💩💩💩">
        <img src="18.png" class="media-item" data-desc="Красива">
        <img src="19.png" class="media-item" data-desc="игнат">

    </div>

    <div id="viewer">
        <div id="viewerContent"></div>
        
        <div id="description"></div>
        
        <div class="nav-buttons">
            <button class="btn" id="prevBtn">⬅</button>
            <button class="btn" id="likeBtn">❤️ <span id="likeCount">0</span></button>
            <button class="btn" id="nextBtn">➡</button>
        </div>
        <p style="color: #64748b; font-size: 0.8rem;">Кликни по фону, чтобы закрыть</p>
    </div>

    <script>
        const galleryItems = Array.from(document.querySelectorAll(".media-item"));
        const viewer = document.getElementById("viewer");
        const viewerContent = document.getElementById("viewerContent");
        const descriptionDiv = document.getElementById("description");
        const likeCountSpan = document.getElementById("likeCount");

        let currentIndex = 0;
        let likes = JSON.parse(localStorage.getItem("server_likes")) || Array(galleryItems.length).fill(0);

        function renderMedia() {
            const item = galleryItems[currentIndex];
            const youtubeId = item.getAttribute("data-youtube");
            const videoSrc = item.getAttribute("data-video");
            const desc = item.getAttribute("data-desc");

            viewerContent.innerHTML = ""; // Очищаем контейнер

            if (youtubeId) {
                // Если это YouTube
                viewerContent.innerHTML = `<iframe style="aspect-ratio: 16/9; width: 90%; max-width: 1000px;" src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else if (videoSrc) {
                // Если это локальное видео mp4
                viewerContent.innerHTML = `<video src="${videoSrc}" controls autoplay style="max-width: 90%; max-height: 70vh; border-radius: 12px; outline: none;"></video>`;
            } else {
                // Если это картинка
                viewerContent.innerHTML = `<img src="${item.src}" style="max-width: 90%; max-height: 70vh; border-radius: 12px;">`;
            }

            descriptionDiv.textContent = desc || "";
            likeCountSpan.textContent = likes[currentIndex] || 0;
        }

        galleryItems.forEach((item, index) => {
            item.onclick = (e) => {
                e.stopPropagation();
                currentIndex = index;
                renderMedia();
                viewer.classList.add("show");
            }
        });

        // Закрытие просмотрщика
        viewer.onclick = (e) => { 
            if(e.target === viewer || e.target.id === "viewerContent") { 
                viewer.classList.remove("show"); 
                viewerContent.innerHTML = ""; // Останавливаем видео при закрытии
            } 
        }
        
        // Листать влево
        document.getElementById("prevBtn").onclick = (e) => { 
            e.stopPropagation(); 
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length; 
            renderMedia(); 
        }
        
        // Листать вправо
        document.getElementById("nextBtn").onclick = (e) => { 
            e.stopPropagation(); 
            currentIndex = (currentIndex + 1) % galleryItems.length; 
            renderMedia(); 
        }

        // Лайки
        document.getElementById("likeBtn").onclick = (e) => {
            e.stopPropagation();
            likes[currentIndex]++;
            likeCountSpan.textContent = likes[currentIndex];
            localStorage.setItem("server_likes", JSON.stringify(likes));
        }
    </script>
</body>
</html>
