<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #020617;
            --card-bg: rgba(30, 41, 59, 0.5);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Кастомный курсор */
        #cursor {
            width: 20px; height: 20px;
            background: var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        header {
            height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0;
            background: linear-gradient(to bottom, #fff, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .section-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .players-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            max-width: 900px;
        }

        .player-chip {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        /* Галерея */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        .photo-card {
            border-radius: 20px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0;
            transform: translateY(30px);
        }

        .photo-card.visible { opacity: 1; transform: translateY(0); }

        .photo-card:hover {
            transform: scale(1.02) translateY(-5px);
            border-color: var(--accent);
        }

        .photo-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        /* Viewer */
        #viewer {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.98);
            backdrop-filter: blur(20px);
            display: none;
            place-items: center;
            z-index: 10000;
        }

        #viewer.active { display: grid; }

        .viewer-content { width: 90%; max-width: 1100px; text-align: center; }
        .viewer-content img { width: 100%; border-radius: 15px; margin-bottom: 20px; }

        .controls { display: flex; justify-content: center; gap: 20px; }
        .btn {
            background: white; border: none; padding: 12px 25px;
            border-radius: 10px; font-weight: 700; transition: 0.2s;
        }
        .btn-like { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <header>
        <div class="section-label">Vanilla Server 2026</div>
        <h1>Memory Lane.</h1>
        <div class="players-container">
            <div class="player-chip">Dosh1rac</div>
            <div class="player-chip">Meizil</div>
            <div class="player-chip">hirrrrrrrrrrrrrr</div>
            <div class="player-chip">_LumiNebula_</div>
            <div class="player-chip">_Nidalap_</div>
            <div class="player-chip">Vivaotslova</div>
        </div>
    </header>

    <main class="gallery">
        <div class="photo-card" data-img="2026-01-24_16.13.01.png" data-desc="Закат красивый">
            <img src="2026-01-24_16.13.01.png">
        </div>
        <div class="photo-card" data-img="2026-01-16_16.01.02.png" data-desc="Нууу...">
            <img src="2026-01-16_16.01.02.png">
        </div>
        <div class="photo-card" data-img="3.png" data-desc="Красиво просто">
            <img src="3.png">
        </div>
        <div class="photo-card" data-img="4.png" data-desc="Ракушка красивая">
            <img src="4.png">
        </div>
        <div class="photo-card" data-img="5.png" data-desc="Кораблик">
            <img src="5.png">
        </div>
        <div class="photo-card" data-img="6.png" data-desc="На ишаках гуляем">
            <img src="6.png">
        </div>
        <div class="photo-card" data-img="7.png" data-desc="Житель на доме стоит">
            <img src="7.png">
        </div>
        <div class="photo-card" data-img="8.png" data-desc="Амбарчик">
            <img src="8.png">
        </div>
        <div class="photo-card" data-img="9.png" data-desc="Соседи">
            <img src="9.png">
        </div>
        <div class="photo-card" data-img="10.png" data-desc="Повесился🤣">
            <img src="10.png">
        </div>
        <div class="photo-card" data-img="11.png" data-desc="Торчун">
            <img src="11.png">
        </div>
        <div class="photo-card" data-img="12.png" data-desc="Барыга">
            <img src="12.png">
        </div>
    </main>

    <div id="viewer">
        <div class="viewer-content">
            <img id="viewerImg" src="">
            <h2 id="viewerDesc"></h2>
            <div class="controls">
                <button class="btn" id="prevBtn">Назад</button>
                <button class="btn btn-like" id="likeBtn">❤️ <span id="likeCount">0</span></button>
                <button class="btn" id="nextBtn">Далее</button>
            </div>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.photo-card').forEach(card => observer.observe(card));

        const cards = document.querySelectorAll('.photo-card');
        const viewer = document.getElementById('viewer');
        const viewerImg = document.getElementById('viewerImg');
        const viewerDesc = document.getElementById("viewerDesc");
        const likeCountSpan = document.getElementById("likeCount");
        
        let currentIndex = 0;
        let likes = JSON.parse(localStorage.getItem("pro_likes")) || Array(cards.length).fill(0);

        cards.forEach((card, index) => {
            card.onclick = () => {
                currentIndex = index;
                updateViewer();
                viewer.classList.add('active');
            };
        });

        function updateViewer() {
            viewerImg.src = cards[currentIndex].dataset.img;
            viewerDesc.textContent = cards[currentIndex].dataset.desc;
            likeCountSpan.textContent = likes[currentIndex];
        }

        document.getElementById('prevBtn').onclick = (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateViewer();
        };

        document.getElementById('nextBtn').onclick = (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % cards.length;
            updateViewer();
        };

        document.getElementById('likeBtn').onclick = (e) => {
            e.stopPropagation();
            likes[currentIndex]++;
            updateViewer();
            localStorage.setItem("pro_likes", JSON.stringify(likes));
        };

        viewer.onclick = () => viewer.classList.remove('active');
    </script>
</body>
</html>
