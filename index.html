<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Screens</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
padding:30px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
gap:20px;
padding:40px;
}

.gallery img{
width:100%;
border-radius:12px;
transition:0.3s;
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.05);
}

</style>
</head>

<body>

<h1>📸 Minecraft Screenshots</h1>

<div class="gallery">

<img src="1.png">
<img src="2.png">
<img src="3.png">

</div>

</body>
</html>
