<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Screens</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
padding:30px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
gap:20px;
padding:40px;
}

.gallery img{
width:100%;
border-radius:12px;
transition:0.3s;
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.05);
}

/* окно просмотра */

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

#viewer img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

</style>
</head>

<body>

<h1>📸 Minecraft Screenshots</h1>

<div class="gallery">

<img src="2026-01-24_16.13.01.png">
<img src="2026-01-16_16.01.02.png">
<img src="3.png">
<img src="4.png">
<img src="5.png">
<img src="6.png">
<img src="7.png">

</div>

<!-- окно для увеличенного изображения -->

<div id="viewer">
<img id="bigImg">
</div>

<script>

const images = document.querySelectorAll(".gallery img");
const viewer = document.getElementById("viewer");
const bigImg = document.getElementById("bigImg");

images.forEach(img => {
img.onclick = () => {
viewer.style.display = "flex";
bigImg.src = img.src;
}
});

viewer.onclick = () => {
viewer.style.display = "none";
}

</script>

</body>
</html>
