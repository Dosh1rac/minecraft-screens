<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Screenshot & Video</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            overflow-x: hidden;
        }

        h1 { padding: 40px 20px; margin: 0; font-size: 2.5rem; }

        .section-title {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Список участников */
        .players-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto 10px auto;
        }

        .player-tag {
            background: #1e293b;
            padding: 6px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.9rem;
            color: #38bdf8;
            cursor: default;
            transition: 0.2s;
        }

        .player-tag:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }

        /* Контейнер для видео */
        .video-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Галерея */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            padding: 20px 40px 60px 40px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        /* Окно просмотра (Viewer) */
        #viewer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #viewer.show { opacity: 1; pointer-events: auto; }

        #viewer img {
            max-width: 90%;
            max-height: 75%;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .nav-buttons { display: flex; gap: 15px; margin-bottom: 15px; }

        .btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover { background: #475569; transform: translateY(-2px); }
        
        #likeBtn { background: #ef4444; display: flex; align-items: center; gap: 8px; }
        #likeBtn:hover { background: #dc2626; }

        #description {
            font-size: 1.1rem;
            color: #cbd5e1;
            padding: 10px 20px;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <header style="padding: 40px 20px;">
        <h1>📸 Скрины с сервака</h1>
        <a href="sborka.zip" download class="btn" style="background: #10b981; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; margin-top: 10px;">
            📥 Скачать сборку (.zip)
        </a>
    </header>

    <div class="section-title">Наши игроки</div>
    <div class="players-section">
        <div class="player-tag">Dosh1rac</div>
        <div class="player-tag">Meizil</div>
        <div class="player-tag">hirrrrrrrrrrrrrr</div>
        <div class="player-tag">_LumiNebula_</div>
        <div class="player-tag">_Nidalap_</div>
        <div class="player-tag">Vivaotslova</div>
    </div>

    <div class="section-title">Галерея контента</div>
    <div class="gallery" id="mainGallery">
        <div class="media-item is-video" data-video-src="video1.mp4" data-desc="Трейлер нашего выживания">
            <img src="preview1.jpg" alt="Video Preview">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; opacity: 0.8;">▶️</div>
        </div>

        <img src="2026-01-24_16.13.01.png" data-desc="Закат красивый">
        <img src="2026-01-16_16.01.02.png" data-desc="Нууу...">
        </div>

    <div id="viewer">
        <div id="mediaContainer" style="width: 100%; display: flex; justify-content: center; align-items: center;">
            <img id="bigImg" style="display: none;">
            <video id="bigVideo" controls style="display: none; max-width: 90%; max-height: 75%; border-radius: 12px;"></video>
        </div>
        
        <div id="description"></div>
        
        <div class="nav-buttons">
            <button class="btn" id="prevBtn">⬅</button>
            <button class="btn" id="likeBtn">❤️ <span id="likeCount">0</span></button>
            <button class="btn" id="nextBtn">➡</button>
        </div>
        <p style="color: #64748b; font-size: 0.8rem;">Кликни по фону, чтобы закрыть</p>
    </div>

    <script>
        // Собираем все элементы, которые можно открыть
        const galleryItems = Array.from(document.querySelectorAll(".gallery img, .media-item"));
        const viewer = document.getElementById("viewer");
        const bigImg = document.getElementById("bigImg");
        const bigVideo = document.getElementById("bigVideo");
        const descriptionDiv = document.getElementById("description");
        const likeCountSpan = document.getElementById("likeCount");

        let currentIndex = 0;
        let likes = JSON.parse(localStorage.getItem("server_likes")) || Array(galleryItems.length).fill(0);

        galleryItems.forEach((item, index) => {
            item.onclick = () => {
                currentIndex = index;
                showMedia();
                viewer.classList.add("show");
            }
        });

        function showMedia() {
            const item = galleryItems[currentIndex];
            const isVideo = item.classList.contains('is-video');

            // Сбрасываем видимость
            bigImg.style.display = "none";
            bigVideo.style.display = "none";
            bigVideo.pause();

            if (isVideo) {
                bigVideo.src = item.dataset.videoSrc;
                bigVideo.style.display = "block";
            } else {
                bigImg.src = item.src;
                bigImg.style.display = "block";
            }

            descriptionDiv.textContent = item.dataset.desc || "";
            likeCountSpan.textContent = likes[currentIndex] || 0;
        }

        // Закрытие и навигация
        viewer.onclick = (e) => { if(e.target === viewer || e.target.id === "mediaContainer") { viewer.classList.remove("show"); bigVideo.pause(); } }
        
        document.getElementById("prevBtn").onclick = (e) => { 
            e.stopPropagation(); 
            currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length; 
            showMedia(); 
        }
        
        document.getElementById("nextBtn").onclick = (e) => { 
            e.stopPropagation(); 
            currentIndex = (currentIndex + 1) % galleryItems.length; 
            showMedia(); 
        }

        document.getElementById("likeBtn").onclick = (e) => {
            e.stopPropagation();
            likes[currentIndex] = (likes[currentIndex] || 0) + 1;
            likeCountSpan.textContent = likes[currentIndex];
            localStorage.setItem("server_likes", JSON.stringify(likes));
        }
    </script>

    <style>
        /* Добавим стиль для контейнера видео в галерее */
        .media-item {
            position: relative;
            cursor: pointer;
            transition: 0.4s;
        }
        .media-item img {
            width: 100%;
            border-radius: 15px;
            display: block;
        }
        .media-item:hover {
            transform: scale(1.03);
        }
    </style>
</body>
</html>
